{% extends "base.html" %}{% block title %}Login | CineBook{% endblock %}
{% block content %}<section class="auth-shell"><div class="auth-aside"><span class="eyebrow">WELCOME BACK</span><h1>The best seat<br>is waiting.</h1><p>Sign in to pick up where your next movie night begins.</p></div><form class="auth-card" method="post"><span class="eyebrow">YOUR ACCOUNT</span><h2>Log in</h2><label>Email address<input type="email" name="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" required placeholder="Your password"></label><button class="btn btn-primary full" type="submit">Log in</button><p class="auth-switch">New to CineBook? <a href="{{ url_for('register') }}">Create an account</a></p></form></section>{% endblock %}
