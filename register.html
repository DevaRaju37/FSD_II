{% extends "base.html" %}{% block title %}Create account | CineBook{% endblock %}
{% block content %}<section class="auth-shell"><div class="auth-aside"><span class="eyebrow">JOIN THE EXPERIENCE</span><h1>Movie nights,<br>made simple.</h1><p>Create an account and keep every booking in one place.</p></div><form class="auth-card" method="post"><span class="eyebrow">GET STARTED</span><h2>Create account</h2><label>Full name<input type="text" name="name" required maxlength="100" placeholder="Your name"></label><label>Email address<input type="email" name="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" required minlength="6" placeholder="At least 6 characters"></label><button class="btn btn-primary full" type="submit">Create account</button><p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></form></section>{% endblock %}
